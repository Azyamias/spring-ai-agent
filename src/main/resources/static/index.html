<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Agent Assistant</title>

    <link rel="stylesheet"
          href="css/style.css">
</head>

<body>

<div class="container">

    <div class="sidebar">

        <h2>AI Agent</h2>

        <button id="newChat">
            + 新会话
        </button>

    </div>

    <div class="chat-container">

        <div class="chat-header">
            Spring AI Agent
        </div>

        <div class="chat-box"
             id="chatBox">

            <div class="message ai">
                你好，我是 AI 助手，请开始聊天。
            </div>

        </div>

        <div class="input-area">

            <textarea id="messageInput"
                      placeholder="请输入问题..."></textarea>

            <button id="sendBtn">
                发送
            </button>

        </div>

    </div>

</div>

<script src="js/app.js"></script>

</body>

</html>
