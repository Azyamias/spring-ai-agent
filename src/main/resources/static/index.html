<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>电商 AI Agent</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">

            电商 AI Agent

        </div>

        <button id="newChat">

            + 新建会话

        </button>

    </aside>

    <main class="main">

        <div id="messages"
             class="messages">

            <div class="welcome">

                <h1>你好 👋</h1>

                <p>我是你的 AI 助手</p>

            </div>

        </div>

        <div class="input-area">

            <textarea id="input"
                      placeholder="请输入问题（Enter 发送，Shift+Enter 换行）"></textarea>

            <button id="send">

                发送

            </button>

        </div>

    </main>

</div>

<script src="/js/app.js"></script>

</body>

</html>
