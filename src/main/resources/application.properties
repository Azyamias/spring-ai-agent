spring.application.name=SAAAssistant

server.port=8888
spring.ai.dashscope.api-key=${SAA_KEY}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/spring_ai_alibaba?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=123456

mybatis.configuration.map-underscore-to-camel-case=true

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0

logging.level.org.springframework.transaction=DEBUG
logging.level.org.mybatis=DEBUG